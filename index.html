<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ryzen 67s</title>
</head>
<body>
    <header id="top">
        <img src="img/rogo.jpg" alt="Ryzen 67s의 공식 로고" id="title">
        <button id="loginDialog열기">로그인/회원가입</button>
        <button id="menu">☰</button>
    </header>
    <dialog id="loginDialog">
        <button class="나가기" id="loginDialog나가기">나가기</button>
        <div id="loginDialog내용">
            <h2>로그인</h2>
            <input type="text" placeholder="id">
            <input type="password" placeholder="password">
            <button id="submit">제출</button>
            <p>아직 계정이 없나요? <span id="회원가입Dialog열기">회원가입</span>으로 계정을 생성하세요!</p>
        </div>
    </dialog>
    <dialog id="회원가입Dialog">
        <button class="나가기" id="회원가입Dialog나가기">나가기</button>
        <div id="회원가입Dialog내용">
        <h2>회원가입</h2>
        <input type="text" placeholder="id">
        <input type="password" placeholder="password">
        <input type="password" placeholder="type password">
        <button id="makeUser">계정 생성</button>
        </div>
    </dialog>
    <div id="게시판">
        <h2>게시판</h2>
        <p>아직 게시물이 없습니다.</p>
    </div>
    <div id="schedule">
        <h2 class="title">경기 일정 및 기록</h2>
        <div id="scheduleCard"></div>
    </div>
    <script type="module" src="script.js"></script>
</body>
</html>
