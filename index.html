<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ryzen 67s</title>
</head>
<body>
    <header id="top">
        <img src="img/rogo2.png" alt="Ryzen 67s의 공식 로고" id="title">
        <button id="loginDialog열기">로그인/회원가입</button>
        <button id="menu">☰</button>
    </header>
    <dialog id="loginDialog">
        <button id="loginDialog나가기">나가기</button>
        <div id="loginDialog내용">
            <h2>로그인</h2>
            <input type="text" placeholder="id">
            <input type="password" placeholder="password">
            <button id="submit">제출</button>
            <p>아직 계정이 없나요? <span id="회원가입열기">회원가입</span>으로 계정을 생성하세요!</p>
        </div>
    </dialog>
    <dialog id="회원가입Dialog">
        <div id="회원가입Dialog내용">
        <h2>회원가입</h2>
        </div>
    </dialog>
    <img src="img/야구.jfif" alt="예시 야구 이미지" width="100%">
    <script src="script.js"></script>
</body>
</html>
